<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rakesh Soni Portfolio · Architecture Graph</title>
  <style>
    body {
      margin: 0;
      background: #04070e;
      color: #e6edf5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    header {
      padding: 16px 24px;
      background: rgba(6, 11, 22, 0.85);
      border-bottom: 1px solid rgba(154, 176, 201, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    h1 { margin: 0; font-size: 16px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #8fc7a4; }
    #canvas-container { position: absolute; top: 60px; left: 0; right: 0; bottom: 0; }
    canvas { width: 100%; height: 100%; display: block; }
    .legend {
      position: absolute; bottom: 20px; left: 24px;
      background: rgba(6, 11, 22, 0.85);
      padding: 12px 18px; border-radius: 4px;
      border: 1px solid rgba(154, 176, 201, 0.2);
      font-size: 11px; font-family: monospace;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
  </style>
</head>
<body>
  <header>
    <h1>Graphify · Rakesh Soni Portfolio Dependency Graph</h1>
    <div style="font-size: 12px; color: #b0bdcc; font-family: monospace;">Nodes: 19 | Edges: 21</div>
  </header>
  <div id="canvas-container">
    <canvas id="graphCanvas"></canvas>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="dot" style="background: #8fc7a4;"></div> Entrypoint & App Root</div>
    <div class="legend-item"><div class="dot" style="background: #38bdf8;"></div> 3D WebGL Engines</div>
    <div class="legend-item"><div class="dot" style="background: #fbbf24;"></div> UI Narrative Sections</div>
    <div class="legend-item"><div class="dot" style="background: #ec4899;"></div> Media & Textures</div>
  </div>

  <script>
    fetch('./graph.json')
      .then(res => res.json())
      .then(data => initGraph(data));

    function initGraph(data) {
      const canvas = document.getElementById('graphCanvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight - 60;

      window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight - 60;
      });

      const colors = {
        entrypoint: '#8fc7a4',
        component_root: '#8fc7a4',
        webgl_canvas: '#38bdf8',
        webgl_intro: '#38bdf8',
        section: '#fbbf24',
        ui_nav: '#fbbf24',
        ui_telemetry: '#fbbf24',
        asset_image: '#ec4899',
        asset_texture: '#ec4899',
        style: '#94a3b8'
      };

      const nodes = data.nodes.map((n, i) => ({
        ...n,
        x: w / 2 + Math.cos(i * (Math.PI * 2 / data.nodes.length)) * (Math.min(w, h) * 0.38),
        y: h / 2 + Math.sin(i * (Math.PI * 2 / data.nodes.length)) * (Math.min(w, h) * 0.38),
        vx: 0,
        vy: 0,
        radius: n.type.includes('root') || n.type.includes('webgl') ? 18 : 12,
        color: colors[n.type] || '#fff'
      }));

      // Set App.jsx near center
      const appNode = nodes.find(n => n.id === 'src/App.jsx');
      if (appNode) { appNode.x = w / 2; appNode.y = h / 2; }

      function render() {
        ctx.fillStyle = '#04070e';
        ctx.fillRect(0, 0, w, h);

        // Draw edges
        ctx.strokeStyle = 'rgba(154, 176, 201, 0.25)';
        ctx.lineWidth = 1;
        data.edges.forEach(e => {
          const s = nodes.find(n => n.id === e.source);
          const t = nodes.find(n => n.id === e.target);
          if (s && t) {
            ctx.beginPath();
            ctx.moveTo(s.x, s.y);
            ctx.lineTo(t.x, t.y);
            ctx.stroke();
          }
        });

        // Draw nodes
        nodes.forEach(n => {
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
          ctx.fillStyle = n.color;
          ctx.shadowBlur = 10;
          ctx.shadowColor = n.color;
          ctx.fill();
          ctx.shadowBlur = 0;

          ctx.font = '10px monospace';
          ctx.fillStyle = '#e6edf5';
          ctx.textAlign = 'center';
          ctx.fillText(n.label, n.x, n.y + n.radius + 14);
        });

        requestAnimationFrame(render);
      }

      render();
    }
  </script>
</body>
</html>
